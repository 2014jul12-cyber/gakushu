<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>れんしゅう メニュー</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#eef5fa"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef5fa;--fg:#1d2b53;--card:#fff;--line:#c9d8e6;--hl:#ffd43b}
@media (prefers-color-scheme:dark){:root{--bg:#121a2b;--fg:#e8eefc;--card:#1b2640;--line:#33425f;--hl:#e9b900}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif}
#m{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 32px}
h1{font-size:32px;margin:0 0 6px;text-align:center}p{text-align:center;opacity:.7;margin:0 0 20px}
.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.app{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:200px;border:3px solid var(--line);border-radius:22px;background:var(--card);color:inherit;text-decoration:none}
.app:active{background:var(--hl);color:#1d2b53}.em{font-size:64px;line-height:1}.app b{font-size:28px}.app small{font-size:16px;opacity:.7}
@media (max-width:640px){.g{grid-template-columns:1fr}.app{min-height:120px}}

<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});</script></body></html>
